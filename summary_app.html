<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 3줄 요약기</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 사용 (Tailwind 기본 폰트) */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 로딩 스피너 스타일 */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6; /* blue-500 */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-10">
        
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">AI 3줄 요약기</h1>
            <p class="text-gray-600 mt-2">요약하고 싶은 텍스트 or URL을 붙여넣으세요.</p>
        </header>

        <!-- 입력 폼 -->
        <main>
            <!-- 텍스트 입력 영역 -->
            <div>
                <label for="textInput" class="block text-sm font-medium text-gray-700 mb-2">입력</label>
                <textarea 
                    id="textInput" 
                    rows="10" 
                    class="w-full p-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    placeholder="이곳에 요약할 내용 or URL을 입력하세요..."></textarea>
            </div>

            <!-- 요약 버튼 -->
            <div class="mt-6">
                <button 
                    id="summarizeButton" 
                    class="w-full flex items-center justify-center bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-300 ease-in-out disabled:bg-gray-400">
                    <span id="buttonText">3줄 요약하기</span>
                    <div id="loadingSpinner" class="spinner hidden ml-3"></div>
                </button>
            </div>

            <!-- 메시지 영역 (오류 등) -->
            <div id="messageDiv" class="mt-4 text-center text-red-500 font-medium"></div>

            <!-- 결과 출력 영역 -->
            <div class="mt-8 border-t border-gray-200 pt-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">요약 결과</h2>
                <div id="summaryResult" class="bg-gray-50 p-5 border border-gray-200 rounded-lg min-h-[120px] whitespace-pre-wrap text-gray-800">
                    <p class="text-gray-400">요약 결과가 여기에 표시됩니다.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // DOM 요소 선택
        const textInput = document.getElementById('textInput');
        const summarizeButton = document.getElementById('summarizeButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const summaryResult = document.getElementById('summaryResult');
        const messageDiv = document.getElementById('messageDiv');

        // --- FastAPI 백엔드 엔드포인트 ---
        // 백엔드(FastAPI)에서 설정한 요약 API 엔드포인트 URL입니다.
        // 로컬에서 테스트 시: 'http://localhost:8000/summarize'
        const backendApiUrl = 'http://localhost:8000/summarize';

        // 버튼 클릭 이벤트 리스너
        summarizeButton.addEventListener('click', handleSummarize);

        async function handleSummarize() {
            const textToSummarize = textInput.value;

            // 입력값 검증
            if (!textToSummarize.trim()) {
                messageDiv.textContent = '요약할 텍스트를 입력해주세요.';
                return;
            }

            // 로딩 상태 설정
            setLoading(true);

            try {
                // FastAPI 백엔드 API 호출
                const summary = await callBackendAPI(textToSummarize);
                
                // 결과 표시
                summaryResult.textContent = summary;
                messageDiv.textContent = ''; // 오류 메시지 제거

            } catch (error) {
                console.error('요약 실패:', error);
                messageDiv.textContent = '요약 중 오류가 발생했습니다. 백엔드 서버 연결을 확인해주세요.';
                summaryResult.innerHTML = '<p class="text-gray-400">요약 결과를 불러오지 못했습니다.</p>';
            } finally {
                // 로딩 상태 해제
                setLoading(false);
            }
        }

        /**
         * 로딩 상태를 설정하고 UI를 업데이트합니다.
         * @param {boolean} isLoading - 로딩 중인지 여부
         */
        function setLoading(isLoading) {
            if (isLoading) {
                summarizeButton.disabled = true;
                buttonText.textContent = '요약 중...';
                loadingSpinner.classList.remove('hidden');
                messageDiv.textContent = ''; // 이전 오류 메시지 초기화
            } else {
                summarizeButton.disabled = false;
                buttonText.textContent = '3줄 요약하기';
                loadingSpinner.classList.add('hidden');
            }
        }

        /**
         * FastAPI 백엔드 API를 호출하여 텍스트 요약을 요청합니다.
         * @param {string} text - 요약할 원본 텍스트
         * @returns {Promise<string>} - 요약된 텍스트
         */
        async function callBackendAPI(text) {
            
            // 백엔드로 보낼 데이터 (FastAPI에서 받을 Pydantic 모델과 일치해야 함)
            const payload = {
                text: text
            };

            // API 호출 (지수 백오프 재시도 포함)
            let response;
            let delay = 1000; // 1초
            for (let i = 0; i < 3; i++) { // 최대 3번 재시도
                try {
                    response = await fetch(backendApiUrl, { // FastAPI 엔드포인트 호출
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                    });

                    if (response.ok) {
                        const result = await response.json();
                        
                        // FastAPI가 {'summary': '...'} 형태로 반환한다고 가정합니다.
                        // 백엔드의 응답 구조에 맞게 이 부분을 수정하세요.
                        if (result && result.summary) { 
                            return result.summary; // 성공 시 요약 반환
                        } else {
                            throw new Error('백엔드 응답 형식이 올바르지 않습니다.');
                        }
                    } else if (response.status >= 500) {
                        // 서버 오류 시 재시도
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2; // 다음 재시도 시간 2배 증가
                    } else {
                        // 4xx 오류 등은 재시도하지 않음
                        throw new Error(`백엔드 API 요청 실패 (상태 코드: ${response.status})`);
                    }
                } catch (error) {
                    // 네트워크 오류 등 재시도
                    if (i === 2) { // 마지막 재시도 실패 시 오류 throw
                        throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
            
            throw new Error('백엔드 API 호출에 실패했습니다 (최대 재시도 횟수 초과).');
        }
    </script>

</body>
</html>
